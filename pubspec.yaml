name: kamitcg
description: "KamiTCG — Portfolio tracker premium pour le jeu de cartes One Piece (OPCG)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Backend / Auth / DB
  supabase_flutter: ^2.12.4

  # Scanner OCR (local)
  google_mlkit_text_recognition: ^0.15.1
  camera: ^0.12.0+1

  # Paiements / abonnements
  purchases_flutter: ^10.0.1

  # Navigation
  go_router: ^17.2.2

  # Graphiques
  fl_chart: ^1.2.0

  # Sécurité — stockage des tokens
  flutter_secure_storage: ^10.0.0

  # Formatage prix / dates
  intl: ^0.20.2

  # Modèles immuables + JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Configuration / secrets
  flutter_dotenv: ^6.0.1

  # Typographies (Inter, Space Grotesk, JetBrains Mono)
  google_fonts: ^8.1.0

  # Cache local des images réseau (illustrations Bandai)
  cached_network_image: ^3.4.1

  # Préférences utilisateur non-sensibles (toggles UI, devise par défaut)
  shared_preferences: ^2.5.5

  # Ouverture de liens externes (CGU, politique de confidentialité)
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Riverpod codegen
  riverpod_generator: ^4.0.3
  # Lints Riverpod désactivés temporairement : custom_lint ^0.8.1 exige analyzer ^8,
  # incompatible avec freezed ^3.2.5 et json_serializable ^6.13.1 (analyzer ≥9-12).
  # À réactiver dès que custom_lint publie une release alignée sur analyzer ≥9.
  # riverpod_lint: ^3.1.3
  # custom_lint: ^0.8.1

  # Freezed + JSON codegen
  freezed: ^3.2.5
  # json_serializable 6.13.1 exige analyzer ≥10, incompatible avec riverpod_generator 4.0.3 (analyzer ^9)
  # et avec le pin meta 1.17.0 du SDK Flutter. À remettre en ^6.13.1 dès que ces deux contraintes lèvent.
  json_serializable: 6.13.0

  build_runner: ^2.15.0

  # Utilisés uniquement par scripts/import_catalogue.dart (one-shot)
  html: ^0.15.6
  http: ^1.6.0

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Le fichier .env est chargé en runtime via flutter_dotenv.
  assets:
    - .env
